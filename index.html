<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduQuest – UCAT Practice Library</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --accent: #7c3aed;
      --accent2: #a855f7;
      --bg: #0f0a1e;
      --surface: #1a1030;
      --surface2: #231848;
      --border: rgba(124, 58, 237, 0.2);
      --text: #f1f0f5;
      --muted: #8b83a3;
      --green: #10b981;
      --font: 'IBM Plex Sans', sans-serif;
      --head: 'Syne', sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
    }

    /* HEADER */
    .hdr {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15, 10, 30, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 28px;
      height: 58px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--head);
      font-weight: 700;
      font-size: 1.1rem;
    }

    .brand-pill {
      background: rgba(124, 58, 237, 0.18);
      color: var(--accent2);
      border: 1px solid rgba(124, 58, 237, 0.3);
      border-radius: 20px;
      padding: 2px 12px;
      font-size: 0.72rem;
      font-family: var(--font);
      font-weight: 500;
    }

    /* HERO */
    .hero {
      max-width: 1400px;
      margin: 0 auto;
      padding: 64px 24px 80px;
      text-align: center;
    }

    .hero-badge {
      display: inline-block;
      background: rgba(124, 58, 237, 0.12);
      border: 1px solid rgba(124, 58, 237, 0.25);
      color: var(--accent2);
      border-radius: 20px;
      padding: 5px 16px;
      font-size: 0.78rem;
      margin-bottom: 20px;
      letter-spacing: 0.04em;
    }

    .hero h1 {
      font-family: var(--head);
      font-size: clamp(2.2rem, 5vw, 3.4rem);
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 18px;
    }

    .hero h1 span {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero p {
      color: var(--muted);
      font-size: 1.02rem;
      line-height: 1.7;
      max-width: 520px;
      margin: 0 auto 40px;
    }

    /* ═══ TAB NAVIGATION ═══ */
    .tab-nav-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 40px;
    }

    .tab-nav {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(20, 14, 40, 0.95);
      border: 1px solid rgba(124, 58, 237, 0.18);
      border-radius: 50px;
      padding: 5px 6px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .tab-btn {
      position: relative;
      background: transparent;
      border: none;
      color: var(--muted);
      font-family: var(--font);
      font-size: 0.85rem;
      font-weight: 500;
      padding: 10px 20px;
      border-radius: 40px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      white-space: nowrap;
      letter-spacing: 0.01em;
    }

    .tab-btn:hover:not(.active) {
      color: var(--text);
      background: rgba(124, 58, 237, 0.08);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      font-weight: 600;
      box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4);
    }

    /* Tab count badge */
    .tab-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.15);
      font-size: 0.65rem;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 10px;
      margin-left: 6px;
      min-width: 20px;
    }

    .tab-btn.active .tab-count {
      background: rgba(255, 255, 255, 0.25);
    }

    /* ═══ TAB CONTENT ═══ */
    .tab-content-area {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* CARD */
    .card-wrap {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      max-width: 1200px;
      margin: 0 auto;
    }

    @media (max-width: 1024px) {
      .card-wrap {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 768px) {
      .card-wrap {
        grid-template-columns: repeat(2, 1fr);
        max-width: 800px;
      }
      .tab-nav {
        border-radius: 20px;
        padding: 6px;
        gap: 3px;
      }
      .tab-btn {
        font-size: 0.75rem;
        padding: 8px 12px;
      }
    }

    @media (max-width: 480px) {
      .card-wrap {
        grid-template-columns: 1fr;
        max-width: 420px;
      }
      .tab-nav {
        flex-direction: column;
        border-radius: 16px;
        width: 100%;
      }
      .tab-btn {
        width: 100%;
        text-align: center;
      }
    }

    .exam-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px 28px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 8px;
      transition: border-color 0.25s ease, transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.25s ease;
      box-shadow: 0 8px 40px rgba(124, 58, 237, 0.08);
      position: relative;
    }

    .exam-card:hover {
      border-color: rgba(168, 85, 247, 0.6);
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 16px 60px rgba(124, 58, 237, 0.3), 0 0 20px rgba(168, 85, 247, 0.25);
    }

    .card-icon {
      font-size: 2.8rem;
      margin-bottom: 4px;
    }

    .card-label {
      font-size: 0.7rem;
      color: var(--accent2);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 600;
    }

    .card-title {
      font-family: var(--head);
      font-size: 1.5rem;
      font-weight: 800;
      margin: 4px 0;
    }

    .card-sub {
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.6;
    }

    .tag {
      display: inline-block;
      background: rgba(16, 185, 129, 0.1);
      color: var(--green);
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: 20px;
      padding: 3px 12px;
      font-size: 0.7rem;
      font-weight: 600;
      margin: 8px 0;
    }

    /* Subtest pills */
    .subtests {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin: 10px 0;
    }

    .sub-pill {
      background: rgba(124, 58, 237, 0.1);
      border: 1px solid rgba(124, 58, 237, 0.2);
      color: var(--accent2);
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 0.68rem;
    }

    .card-btn {
      display: block;
      width: 100%;
      margin-top: auto;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      text-decoration: none;
      padding: 13px 20px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.92rem;
      transition: opacity 0.2s, transform 0.2s;
    }

    .card-btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    /* Tab Switch Animation */
    .animate-tab-fade {
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 250ms ease-out, transform 250ms ease-out;
    }

    .animate-tab-fade.active {
      opacity: 1;
      transform: translateY(0);
    }

    footer {
      text-align: center;
      padding: 32px;
      color: var(--muted);
      font-size: 0.78rem;
      border-top: 1px solid var(--border);
      margin-top: 40px;
    }
  </style>
</head>

<body>

  <header class="hdr">
    <div class="brand">
      <span>🏥</span><span><a href="https://eduquest.org.in/eduQuest/"
          style="color:inherit; text-decoration:none;">EduQuest</a></span>
      <span class="brand-pill">UCAT Practice Test</span>
    </div>
    <div id="auth-section" style="font-family: sans-serif; font-size: 0.9rem;">
      <!-- Rendered dynamically via JS -->
    </div>
  </header>

  <main class="hero">
    <div class="hero-badge">✦ UCAT Practice Library</div>
    <h1>UCAT<br><span>Practice Mocks</span></h1>
    <p>Select a subtest below to view and complete our available practice modules — timed, scored, and instantly logged.</p>

    <!-- ═══ TAB NAVIGATION BAR ═══ -->
    <div class="tab-nav-wrapper">
      <nav class="tab-nav" id="tabNav">
        <button class="tab-btn active" onclick="switchTab('full')" data-tab="full">🏆 UCAT Full Mock</button>
        <button class="tab-btn" onclick="switchTab('vr')" data-tab="vr">📖 Verbal Reasoning</button>
        <button class="tab-btn" onclick="switchTab('dm')" data-tab="dm">🧩 Decision Making</button>
        <button class="tab-btn" onclick="switchTab('qr')" data-tab="qr">🔢 Quantitative Reasoning</button>
        <button class="tab-btn" onclick="switchTab('sj')" data-tab="sj">⚖️ Situational Judgement</button>
      </nav>
    </div>

    <!-- ═══ TAB CONTENT AREA ═══ -->
    <div class="tab-content-area">
      <div id="cardGrid" class="card-wrap animate-tab-fade">
        <!-- Dynamically rendered via JS -->
      </div>
    </div>
  </main>

  <footer>© EduQuest · UCAT Practice Test · Free for all students</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="env.js"></script>
  <script src="supabase.js"></script>
  <script src="email.js"></script>
  <script>
    // ── DATASET & REUSABLE COMPONENTS ──
    const tests = [];

    // Add 7 Full Mock Tests (103 Mins, 184 Questions)
    function addFullMockTests() {
      for (let i = 1; i <= 7; i++) {
        tests.push({
          type: 'full',
          icon: '🏆',
          badge: `FULL MOCK EXAM ${i}`,
          title: `UCAT Full Mock Test ${i}`,
          questions: 184,
          duration: 103,
          subtests: 4,
          subjects: ['VR (44q)', 'DM (35q)', 'QR (36q)', 'SJT (69q)'],
          buttonText: `Start Full Mock ${i}`,
          link: `./test_full_mock.html?mock=${i}`
        });
      }
    }
    addFullMockTests();

    // Helper to generate part cards programmatically
    function addPartTests(type, name, icon, dir, totalQuestions) {
      const totalParts = Math.ceil(totalQuestions / 20);
      for (let i = 1; i <= totalParts; i++) {
        const isLast = (i === totalParts);
        const qCount = isLast ? (totalQuestions % 20 || 20) : 20;
        const minutes = Math.ceil(qCount * 30 / 60); // 30 sec per question

        tests.push({
          type: type,
          icon: icon,
          badge: `PART ${i} OF ${totalParts}`,
          title: `${name} – Part ${i}`,
          questions: qCount,
          duration: minutes,
          subtests: 1,
          subjects: [name],
          buttonText: `Start Part ${i}`,
          link: `./${dir}/test_ucat.html?part=${i}`
        });
      }
    }

    // Load topic parts into tests list
    addPartTests('vr', 'Verbal Reasoning', '📖', 'test_vr_parts', 338);
    addPartTests('dm', 'Decision Making', '🧩', 'test_dm_parts', 207);
    addPartTests('qr', 'Quantitative Reasoning', '🔢', 'test_qr_parts', 372);
    addPartTests('sj', 'Situational Judgement', '⚖️', 'test_sj_parts', 436);

    // Reusable TestCard template
    function TestCard(props) {
      const subtestsText = props.subtests > 1 ? ` • ${props.subtests} Subtests` : ' • 1 Subtest';
      const subjectsHtml = props.subjects.map(subject => `<span class="sub-pill">${subject}</span>`).join('');
      
      return `
        <div class="exam-card">
          <div class="card-icon">${props.icon}</div>
          <div class="card-label">${props.badge}</div>
          <div class="card-title">${props.title}</div>
          <div class="card-sub">${props.questions} Questions • ${props.duration} Minutes${subtestsText}</div>
          <div class="subtests">
            ${subjectsHtml}
          </div>
          <span class="tag">✓ Available Now</span>
          <a href="${props.link}" class="card-btn" data-original-href="${props.link}" data-original-text="${props.buttonText}">${props.buttonText} →</a>
        </div>
      `;
    }

    // Global session access state
    let userSession = null;
    let hasAccess = false;

    // Apply remote access checking rules to dynamically rendered cards
    function applyAccessControl() {
      const allBtns = document.querySelectorAll('.card-btn');
      const unlockedHrefs = ['./test_ucat.html'];

      allBtns.forEach(btn => {
        const origHref = btn.getAttribute('data-original-href') || btn.getAttribute('href') || '';
        const origText = btn.getAttribute('data-original-text') || btn.textContent.replace(' →', '') || '';

        if (unlockedHrefs.includes(origHref)) return;

        if (!userSession) {
          btn.textContent = 'Log in to Access 🔒';
          btn.style.background = 'rgba(255,255,255,0.1)';
          btn.style.color = '#fff';
          btn.removeAttribute('href');
          btn.onclick = (e) => {
            e.preventDefault();
            window.location.href = 'login.html?redirect=index.html';
          };
        } else if (!hasAccess) {
          btn.textContent = 'Request Access 🔒';
          btn.style.background = '#d97706';
          btn.style.color = '#fff';
          btn.removeAttribute('href');
          btn.onclick = async (e) => {
            e.preventDefault();
            btn.textContent = 'Sending Request...';
            try {
              const supabaseClient = window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);
              await supabaseClient.from('profiles').update({ ucat_access_requested: true }).eq('id', userSession.user.id);
            } catch (err) {
              console.error('DB Update failed:', err);
            }
            btn.textContent = 'Request Sent ✅';
            btn.style.background = '#059669';
            setTimeout(() => {
              alert('Your request for UCAT access has been sent to the admin. Please wait for approval.');
            }, 100);
          };
        } else {
          // User HAS ACCESS: Unlock button!
          btn.textContent = `${origText} →`;
          btn.style.background = '';
          btn.style.color = '';
          btn.setAttribute('href', origHref);
          btn.onclick = null;
        }
      });
    }

    // ── TAB SWITCHING LOGIC WITH ANIMATION ──
    function switchTab(tabName) {
      // Toggle active states on tab buttons
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-tab') === tabName);
      });

      const grid = document.getElementById('cardGrid');
      if (!grid) return;

      // Fade out
      grid.classList.remove('active');

      // Update contents and fade in using requestAnimationFrame to ensure smooth transition
      requestAnimationFrame(() => {
        const filtered = tests.filter(test => test.type === tabName);
        grid.innerHTML = filtered.map(test => TestCard(test)).join('');
        
        // Apply access checks to the newly rendered cards
        applyAccessControl();

        requestAnimationFrame(() => {
          grid.classList.add('active');
        });
      });
    }

    // ── INITIALIZE PAGE ──
    document.addEventListener('DOMContentLoaded', () => {
      // Default active tab
      switchTab('full');
    });

    // ── AUTHENTICATION ──
    (async function initAuth() {
      if (!window.supabase) return;
      const supabaseClient = window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);
      const { data: { session } } = await supabaseClient.auth.getSession();

      const authSection = document.getElementById('auth-section');
      userSession = session;

      if (!session) {
        authSection.innerHTML = `<a href="login.html?redirect=index.html" style="color:#60a5fa; text-decoration:none; border:1px solid #60a5fa; padding:5px 12px; border-radius:4px;">Log In</a>`;
      } else {
        authSection.innerHTML = `
        <a href="dashboard.html" style="color:#a78bfa; text-decoration:none; border:1px solid rgba(167,139,250,0.3); padding:5px 12px; border-radius:4px; margin-right:8px; transition:all 0.2s;">📊 Dashboard</a>
        <span style="color:rgba(255,255,255,0.7); margin-right:10px;">${session.user.email}</span>
        <button onclick="logout()" style="background:none; border:1px solid rgba(255,255,255,0.2); color:#fff; padding:4px 10px; border-radius:4px; cursor:pointer;">Logout</button>`;

        window.logout = async () => {
          await supabaseClient.auth.signOut();
          window.location.reload();
        };

        try {
          const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', session.user.id).single();
          const isAdmin = session.user.email === 'rupali.eduquest@gmail.com';
          hasAccess = isAdmin || (profile && (profile.has_ucat_access || profile.has_access));
        } catch (err) {
          console.error('Error fetching profile access:', err);
        }
      }

      // Initial access control check for first render
      applyAccessControl();
    })();
  </script>
</body>

</html>
